server {
    listen 8080;
    server_name _;
    root /srv;
    index index.html;
    location ~ /\. { return 404; }
    location ~* \.(?:js|css|json|png|jpg|jpeg|webp|svg|gif|ico|woff2?|zip|mp4|mp3|wasm)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
